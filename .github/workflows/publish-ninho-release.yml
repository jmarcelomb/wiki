# Back-fills the canonical Ninho release and the Squirrel update feed on
# jmarcelomb/element-web from the releases built here (see build-ninho.yml).
#
# Why this exists: element-web's Actions event processing is broken (push,
# dispatch and schedule all dead), so its own pipeline cannot publish. This
# repo's runners sit inside GitHub's network and use the NINHO_PAT secret to
# write to element-web instead. Everything is idempotent: it creates the
# element-web release only if missing, and rewrites the feed only when it
# doesn't already point at the latest tag. When element-web's own pipeline
# recovers, both checks pass and this workflow becomes a no-op.
#
# Requires the NINHO_PAT repository secret (classic PAT with `repo` scope).
# Without it, the workflow exits without doing anything.

name: Publish Ninho release to element-web

on:
    workflow_dispatch:
    schedule:
        - cron: "7 * * * *"
    push:
        branches:
            - master
            - ninho

permissions:
    contents: read # all writes go to element-web through the PAT

defaults:
    run:
        shell: bash

env:
    SOURCE_REPO: jmarcelomb/element-web

jobs:
    publish:
        name: Back-fill canonical release and update feed
        runs-on: ubuntu-latest
        steps:
            - name: Publish release and feed on element-web
              env:
                  GH_TOKEN: ${{ secrets.NINHO_PAT }}
              run: |
                  set -euo pipefail
                  if [ -z "${GH_TOKEN:-}" ]; then
                      echo "NINHO_PAT secret not set; skipping."
                      exit 0
                  fi

                  TAG=$(gh api "repos/$SOURCE_REPO/git/matching-refs/tags/ninho-v" --jq '.[].ref' | sed 's|refs/tags/||' | sort -V | tail -1)
                  if [ -z "$TAG" ]; then
                      echo "no ninho-v* tags on $SOURCE_REPO; nothing to do"
                      exit 0
                  fi
                  echo "latest tag: $TAG"

                  # Canonical release on element-web, with the assets built here.
                  if gh release view "$TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
                      echo "release $TAG already exists on $SOURCE_REPO"
                  elif ! gh release view "$TAG" >/dev/null 2>&1; then
                      echo "no built release for $TAG here yet; the build workflow runs first"
                      exit 0
                  else
                      mkdir -p assets && cd assets
                      gh release download "$TAG" --clobber --pattern "*-full.nupkg" --pattern "*Setup*.exe"
                      gh release create "$TAG" --repo "$SOURCE_REPO" \
                          --title "Ninho ${TAG#ninho-}" \
                          --notes "Ninho installer built from tag \`$TAG\`.

                  - \`Ninho.Setup.*.exe\` — installer (unsigned: Windows SmartScreen warns on first launch, choose More info -> Run anyway)
                  - \`*-full.nupkg\` — update package consumed by the app's auto-updater

                  Source: https://github.com/$SOURCE_REPO" \
                          "$(ls *-full.nupkg)" "$(ls *Setup*.exe)"
                      cd ..
                      echo "release $TAG published on $SOURCE_REPO"
                  fi

                  # Squirrel update feed: win32/x64/RELEASES on the ninho-update branch,
                  # served raw at the update_base_url baked into the bundled app config.
                  if ! gh api "repos/$SOURCE_REPO/git/ref/heads/ninho-update" >/dev/null 2>&1; then
                      DEFAULT_SHA=$(gh api "repos/$SOURCE_REPO/git/ref/heads/develop" --jq .object.sha)
                      gh api --method POST "repos/$SOURCE_REPO/git/refs" -f ref=refs/heads/ninho-update -f sha="$DEFAULT_SHA" >/dev/null
                      echo "created ninho-update branch"
                  fi

                  CURRENT=$(gh api "repos/$SOURCE_REPO/contents/win32/x64/RELEASES?ref=ninho-update" --jq .content 2>/dev/null | base64 -d || true)
                  if [ -n "$CURRENT" ] && [[ "$CURRENT" == *"/releases/download/$TAG/"* ]]; then
                      echo "feed already points at $TAG"
                      exit 0
                  fi

                  FEED_SHA=$(gh api "repos/$SOURCE_REPO/contents/win32/x64/RELEASES?ref=ninho-update" --jq .sha 2>/dev/null || true)
                  mkdir -p feed && cd feed
                  gh release download "$TAG" --repo "$SOURCE_REPO" --clobber --pattern "*-full.nupkg"
                  NUPKG=$(ls *-full.nupkg)
                  SHA1=$(sha1sum "$NUPKG" | cut -d' ' -f1)
                  SIZE=$(stat -c%s "$NUPKG")
                  echo "$SHA1 https://github.com/$SOURCE_REPO/releases/download/$TAG/$NUPKG $SIZE" > RELEASES
                  cat RELEASES
                  ARGS=(--method PUT "repos/$SOURCE_REPO/contents/win32/x64/RELEASES" -f message="Ninho update feed $TAG" -f content="$(base64 -w0 RELEASES)" -f branch=ninho-update)
                  if [ -n "$FEED_SHA" ]; then
                      ARGS+=(-f sha="$FEED_SHA")
                  fi
                  gh api "${ARGS[@]}" >/dev/null
                  echo "feed published for $TAG"
